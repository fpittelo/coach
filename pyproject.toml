[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coach-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for Intervals.icu endurance coaching and training analytics"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    { name = "Frederic Pitteloud", email = "fpittelo@users.noreply.github.com" },
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
coach-mcp = "coach_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coach_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
